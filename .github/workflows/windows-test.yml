name: Windows nativo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/local-server/**'
      - 'packages/**'
      - 'scripts/*windows*'
      - 'scripts/windows-package/**'
      - 'scripts/*local*'
      - 'scripts/*fiscal*'
      - 'package*.json'
      - '.github/workflows/windows-test.yml'

permissions:
  contents: read

jobs:
  native-test:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar Rust estável
        run: rustup default stable
      - name: Compilar executável nativo de testes
        run: npm run build:windows:test
      - name: Disponibilizar executável de teste
        uses: actions/upload-artifact@v4
        with:
          name: deck26-windows-teste
          path: native-target/release/deck26-desktop.exe
          if-no-files-found: error
          retention-days: 14

      - name: Compilar operação local
        run: npm run build:windows:local
      - name: Montar instalador gráfico
        shell: pwsh
        run: ./scripts/package-windows.ps1 -OutputDirectory windows-package
      - name: Disponibilizar instalador operacional
        uses: actions/upload-artifact@v4
        with:
          name: deck26-windows-operacao-local
          path: |
            windows-package/DECK26-Instalador.exe
            windows-package/release.json
          if-no-files-found: error
          retention-days: 14
